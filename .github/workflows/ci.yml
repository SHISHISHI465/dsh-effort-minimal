name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix test
      - run: node scripts/preflight.mjs
      - run: npm test --prefix test
      - run: npm pack --dry-run --json
